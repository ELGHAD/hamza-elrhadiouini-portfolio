<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Hamza El Rhadiouini — Portfolio</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Page-specific title, description, canonical, hreflang, Open Graph and JSON-LD come from SeoService. -->
    <meta name="author" content="Hamza El Rhadiouini" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0B0F0D" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F8FAFC" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!--
      Self-hosted fonts (copied from the @fontsource packages by angular.json, Latin subset only).
      Preloaded so they arrive before the first render: without it, each late font forces a
      full relayout of the page.
    -->
    <link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/jetbrains-mono-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Inter Variable';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('fonts/inter-latin-wght-normal.woff2') format('woff2-variations');
      }
      @font-face {
        font-family: 'JetBrains Mono Variable';
        font-style: normal;
        font-weight: 100 800;
        font-display: swap;
        src: url('fonts/jetbrains-mono-latin-wght-normal.woff2') format('woff2-variations');
      }
    </style>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
