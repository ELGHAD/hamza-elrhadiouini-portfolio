<article class="project-card" [class.project-card--compact]="project.compact">
  <div class="project-card__body">
    <h3 class="project-card__title">{{ project.title }}</h3>
    <p class="project-card__tagline">{{ project.tagline }}</p>

    @if (!project.compact) {
      <div class="project-card__stack">
        @for (tech of project.techStack.slice(0, 5); track tech) {
          <app-skill-tag [label]="tech"></app-skill-tag>
        }
      </div>
    }

    <div class="project-card__actions">
      @if (!project.compact) {
        <a [routerLink]="['/projects', project.id]" class="project-card__link">
          View details &rarr;
        </a>
      }
      @if (project.githubUrl) {
        <a [href]="project.githubUrl" target="_blank" rel="noopener" class="project-card__link">
          GitHub &#8599;
        </a>
      }
    </div>
  </div>
</article>
