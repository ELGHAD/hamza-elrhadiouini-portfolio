@if (routerLinkTo) {
  <a [routerLink]="routerLinkTo" class="cta-button" [ngClass]="'cta-button--' + variant">{{ label }}</a>
} @else if (href) {
  <a [href]="href" [attr.target]="external ? '_blank' : null" [attr.rel]="external ? 'noopener' : null" class="cta-button" [ngClass]="'cta-button--' + variant">{{ label }}</a>
} @else {
  <button type="button" class="cta-button" [ngClass]="'cta-button--' + variant">{{ label }}</button>
}
