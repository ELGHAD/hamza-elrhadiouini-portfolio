@let locale = localeService.locale();
<header class="site-header" [class.is-scrolled]="scrolled()" [class.is-open]="isMenuOpen">
  <div class="site-header__inner">
    <a
      [routerLink]="localeService.path()"
      class="site-header__logo"
      (click)="closeMenu()"
      [attr.aria-label]="
        locale === 'fr'
          ? 'ELGHAD · Hamza El Rhadiouini, accueil'
          : 'ELGHAD · Hamza El Rhadiouini, home'
      "
    >
      <app-logo></app-logo>
    </a>

    <button
      class="site-header__menu-btn"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen"
      aria-controls="primary-navigation"
      [attr.aria-label]="isMenuOpen ? copy.closeMenu[locale] : copy.openMenu[locale]"
    >
      <span></span><span></span><span></span>
    </button>

    <nav
      id="primary-navigation"
      class="site-header__nav"
      [class.site-header__nav--open]="isMenuOpen"
      [attr.aria-label]="copy.navigation[locale]"
    >
      <div class="site-header__links">
        @for (link of links; track link.path; let index = $index) {
          <a
            [routerLink]="localeService.path(link.path)"
            routerLinkActive="active"
            [style.--item]="index"
            (click)="closeMenu()"
            >{{ copy[link.label][locale] }}</a
          >
        }
      </div>
      <div class="site-header__tools" [style.--item]="links.length">
        <div class="site-header__language" role="group" [attr.aria-label]="copy.language[locale]">
          <a
            [routerLink]="localeService.switchPath('fr')"
            [attr.aria-current]="locale === 'fr' ? 'page' : null"
            lang="fr"
            >FR</a
          >
          <a
            [routerLink]="localeService.switchPath('en')"
            [attr.aria-current]="locale === 'en' ? 'page' : null"
            lang="en"
            >EN</a
          >
        </div>
        <app-theme-toggle></app-theme-toggle>
        <a
          class="site-header__contact"
          [routerLink]="localeService.path('contact')"
          routerLinkActive="is-current"
          (click)="closeMenu()"
          >{{ copy.contact[locale] }}<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M5 12h14M13 6l6 6-6 6" /></svg
        ></a>
      </div>
    </nav>
  </div>
  <!-- Reading progress along the bottom edge. -->
  <span class="site-header__progress" [style.transform]="'scaleX(' + progress() + ')'" aria-hidden="true"></span>
</header>
