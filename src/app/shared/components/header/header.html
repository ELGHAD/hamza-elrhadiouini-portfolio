<header class="site-header">
  <div class="site-header__inner">
    <a
      [routerLink]="localeService.path()"
      class="site-header__logo"
      (click)="closeMenu()"
      [attr.aria-label]="
        localeService.locale() === 'fr'
          ? 'ELGHAD · Hamza El Rhadiouini, accueil'
          : 'ELGHAD · Hamza El Rhadiouini, home'
      "
    >
      <!-- ELGHAD globe: wordmark across the equator, overflowing the sphere, with an orbit. -->
      <svg class="logo" viewBox="0 0 156 56" aria-hidden="true" focusable="false">
        <ellipse class="logo__orbit" cx="78" cy="28" rx="56" ry="12" transform="rotate(-14 78 28)" />
        <circle class="logo__sphere" cx="78" cy="28" r="25" />
        <g class="logo__grid">
          <ellipse cx="78" cy="28" rx="10" ry="25" />
          <ellipse cx="78" cy="28" rx="18.5" ry="25" />
          <path d="M78 3v50M56.1 16h43.8M56.1 40h43.8" />
        </g>
        <circle class="logo__node" cx="23.7" cy="41.5" r="3" />
        <circle class="logo__node" cx="132.3" cy="14.5" r="3" />
        <text class="logo__word" x="78" y="34.5" text-anchor="middle">ELGHAD</text>
      </svg>
    </a>

    <button
      class="site-header__menu-btn"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen"
      aria-controls="primary-navigation"
      [attr.aria-label]="
        isMenuOpen ? copy.closeMenu[localeService.locale()] : copy.openMenu[localeService.locale()]
      "
    >
      <span></span><span></span><span></span>
    </button>

    <nav
      id="primary-navigation"
      class="site-header__nav"
      [class.site-header__nav--open]="isMenuOpen"
      [attr.aria-label]="copy.navigation[localeService.locale()]"
    >
      <a
        [routerLink]="localeService.path('projects')"
        routerLinkActive="active"
        (click)="closeMenu()"
        >{{ copy.projects[localeService.locale()] }}</a
      >
      <a
        [routerLink]="localeService.path('experience')"
        routerLinkActive="active"
        (click)="closeMenu()"
        >{{ copy.experience[localeService.locale()] }}</a
      >
      <a
        [routerLink]="localeService.path('services')"
        routerLinkActive="active"
        (click)="closeMenu()"
        >{{ copy.services[localeService.locale()] }}</a
      >
      <a
        [routerLink]="localeService.path('skills')"
        routerLinkActive="active"
        (click)="closeMenu()"
        >{{ copy.skills[localeService.locale()] }}</a
      >
      <a
        [routerLink]="localeService.path('certifications')"
        routerLinkActive="active"
        (click)="closeMenu()"
        >{{ copy.certifications[localeService.locale()] }}</a
      >
      <div
        class="site-header__language"
        role="group"
        [attr.aria-label]="copy.language[localeService.locale()]"
      >
        <a
          [routerLink]="localeService.switchPath('fr')"
          [attr.aria-current]="localeService.locale() === 'fr' ? 'page' : null"
          lang="fr"
          >FR</a
        >
        <a
          [routerLink]="localeService.switchPath('en')"
          [attr.aria-current]="localeService.locale() === 'en' ? 'page' : null"
          lang="en"
          >EN</a
        >
      </div>
      <app-theme-toggle></app-theme-toggle>
      <a
        class="site-header__contact"
        [routerLink]="localeService.path('contact')"
        (click)="closeMenu()"
        >{{ copy.contact[localeService.locale()] }}</a
      >
    </nav>
  </div>
</header>
