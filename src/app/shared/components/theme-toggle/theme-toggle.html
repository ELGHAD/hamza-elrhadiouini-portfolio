<button
  class="theme-toggle"
  type="button"
  (click)="toggle()"
  [attr.aria-label]="
    themeService.theme() === 'dark'
      ? copy.themeLight[localeService.locale()]
      : copy.themeDark[localeService.locale()]
  "
>
  @if (themeService.theme() === 'dark') {
    <span aria-hidden="true">&#9789;</span>
  } @else {
    <span aria-hidden="true">&#9788;</span>
  }
</button>
