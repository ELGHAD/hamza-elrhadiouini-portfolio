<button
  class="theme-toggle"
  type="button"
  (click)="toggle()"
  [class.is-light]="themeService.theme() === 'light'"
  [attr.aria-label]="
    themeService.theme() === 'dark'
      ? copy.themeLight[localeService.locale()]
      : copy.themeDark[localeService.locale()]
  "
>
  <!-- Both icons stay in the DOM and swap with a turn, so the change is animated. -->
  <svg class="theme-toggle__icon theme-toggle__moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" />
  </svg>
  <svg class="theme-toggle__icon theme-toggle__sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <circle cx="12" cy="12" r="4" />
    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
  </svg>
</button>
