<button
  class="theme-toggle"
  type="button"
  (click)="toggle()"
  [attr.aria-label]="themeService.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
>
  @if (themeService.theme() === 'dark') {
    <span aria-hidden="true">&#9789;</span>
  } @else {
    <span aria-hidden="true">&#9788;</span>
  }
</button>
